<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Test</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    .log { margin: 5px 0; padding: 5px; border-bottom: 1px solid #ccc; }
    .error { color: red; background: #fee; }
    .success { color: green; }
    button { padding: 10px 20px; margin: 10px 0; font-size: 16px; }
    #status { position: fixed; top: 0; right: 0; background: #333; color: white; padding: 10px; font-size: 12px; }
  </style>
</head>
<body>
  <div id="status">Status: waiting</div>
  <h1>Upload Diagnostic Test</h1>
  <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" />
  <button onclick="document.getElementById('fileInput').click()">Choose File</button>
  <div id="logs"></div>

  <script type="module">
    import * as XLSX from '/node_modules/.vite/deps/xlsx.js?v=7717c87e';

    window.testResult = {};

    function log(msg, isErr = false) {
      const div = document.createElement('div');
      div.className = 'log ' + (isErr ? 'error' : 'success');
      div.textContent = msg;
      document.getElementById('logs').appendChild(div);
      document.getElementById('status').textContent = 'Status: ' + msg;
      if (isErr) console.error(msg);
      else console.log(msg);
    }

    // Polyfill for file.arrayBuffer()
    async function fileToArrayBuffer(file) {
      log('Stage: FileReader readAsArrayBuffer');
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          log('Stage: FileReader.onload fired');
          resolve(e.target.result);
        };
        reader.onerror = (e) => {
          log('Stage: FileReader.onerror fired: ' + JSON.stringify(e), true);
          reject(e);
        };
        reader.readAsArrayBuffer(file);
        log('Stage: FileReader.readAsArrayBuffer called');
      });
    }

    document.getElementById('fileInput').addEventListener('change', async (e) => {
      log('Stage: input change fired');
      const files = e.target.files;
      log('Files count: ' + (files?.length || 0));
      if (!files || files.length === 0) return;
      
      const file = files[0];
      log('Stage: File object - name=' + file.name + ' size=' + file.size + ' type=' + file.type);
      
      try {
        log('Stage: file.arrayBuffer() starting');
        const buffer = await fileToArrayBuffer(file);
        log('Stage: ArrayBuffer created, byteLength=' + (buffer?.byteLength || 'null'));
        
        log('Stage: XLSX.read starting');
        const result = XLSX.read(buffer, { type: 'array' });
        log('Stage: XLSX.read completed, SheetNames=' + JSON.stringify(result?.SheetNames));
        log('Stage: workbook sheets=' + Object.keys(result.Sheets || {}).length);
        
        log('Stage: sheet_to_json');
        const sheetName = result.SheetNames[0];
        const jsonData = XLSX.utils.sheet_to_json(result.Sheets[sheetName], { header: 1, defval: null, raw: true });
        log('Stage: JSON data=' + JSON.stringify(jsonData));
        log('ALL STAGES PASSED');
      } catch (err) {
        log('Stage: ERROR - ' + (err?.message || err) + ' stack: ' + (err?.stack || 'no stack'), true);
        log('Stage: ERROR NAME - ' + (err?.name || 'unknown'), true);
        log('Stage: ERROR CODE - ' + (err?.code || 'no code'), true);
      }
    });
  </script>
</body>
</html>
